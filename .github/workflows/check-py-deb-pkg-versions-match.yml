name: Check py deb pkg versions match
on:
  workflow_call:
    inputs:
      debian_changelog_file_path:
        description: Path for the Debian changelog file
        required: false
        default: "debian/changelog"
        type: string
      python_version_file_path:
        description: Path for the Python package __version__.py file
        required: true
        type: string
permissions:
  contents: read

jobs:
  check-version:
    name: check version
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check if ${{ inputs.python_version_file_path }} exists
        run: |
          if [ ! -f "${{ inputs.python_version_file_path }}" ]; then
            echo "Error: ${{ inputs.python_version_file_path }} not found"
            echo "Error: Python packages are expected to have a __version__.py file."
            exit 1
          fi

      - name: Extract Version from Debian changelog
        id: extract-version
        env:
          CHANGELOG: ${{ inputs.debian_changelog_file_path }}
        run: |
          DEB_VERSION=$(head -n 1 "$CHANGELOG" | sed -E 's/.*\(([^)]+)\).*/\1/')
          if [ -z "$DEB_VERSION" ]; then
            echo "Error: failed to parse or find version on the first line of $CHANGELOG"
            exit 1
          fi
          # Strip the epoch (e.g., 1:) and debian revision (e.g., -1) for Python package version
          PY_COMPAT_DEB_VERSION=$(echo "$DEB_VERSION" | sed -E 's/^[0-9]+://; s/-.*//')
          if [ -z "$PY_COMPAT_DEB_VERSION" ]; then
            echo "Error: failed to set PY_COMPAT_DEB_VERSION from DEB_VERSION"
            exit 1
          fi
          echo "DEB_VERSION=$DEB_VERSION" >> "$GITHUB_ENV"
          echo "Debian package version: $DEB_VERSION"
          echo "PY_COMPAT_DEB_VERSION=$PY_COMPAT_DEB_VERSION" >> "$GITHUB_ENV"
          echo "Formatted Python version: $PY_COMPAT_DEB_VERSION"

      - name: Check if Debian version is valid
        run: |
          if ! dpkg --validate-version "$DEB_VERSION"; then
            echo "Error: Invalid Debian version format detected: $DEB_VERSION"
            exit 1
          else
            echo "Debian package version: $DEB_VERSION"
          fi

      - name: Get Python package version
        run: |
          CURRENT_PY_VERSION=$(grep -oP '__version__\s*=\s*["'\'']\K(.*?)(?=["'\''])' "${{ inputs.python_version_file_path }}")

          if [ -z "$CURRENT_PY_VERSION" ]; then
            echo "Error: current Python package '__version__' value at ${{ inputs.python_version_file_path }} is an empty string."
            exit 1
          fi
          echo "Python package version: $CURRENT_PY_VERSION"
          echo "CURRENT_PY_VERSION=$CURRENT_PY_VERSION" >> "$GITHUB_ENV"

      - name: Fail if ${{ inputs.python_version_file_path }} needs update
        id: check-version
        env:
          CHANGELOG: ${{ inputs.debian_changelog_file_path }}
          VERSION_FILE: ${{ inputs.python_version_file_path }}
        run: |
          base_version() {
            printf '%s\n' "$1" | sed -E 's/^[0-9]+://; s/([0-9]+\.[0-9]+\.[0-9]+).*/\1/'
          }
          # a, b or rc right after major.minor.patch, PEP 440 spellings normalized
          # (beta3, -b3, ~b3 -> b3). Debian revisions, ~dev snapshots and .postN are ignored.
          pre_release() {
            printf '%s\n' "$1" | sed -E 's/^[0-9]+://' | tr '[:upper:]' '[:lower:]' |
              sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+[-~._]?(alpha|beta|preview|pre|rc|a|b|c)[._]?([0-9]*)([^a-z].*)?$/\1 \2/p' |
              sed -E 's/^alpha/a/; s/^beta/b/; s/^(preview|pre|c) /rc /; s/ $/ 0/; s/ 0*([0-9])/\1/'
          }

          BASE_PY_VERSION=$(base_version "$CURRENT_PY_VERSION")
          BASE_DEB_VERSION=$(base_version "$DEB_VERSION")
          PRE_PY_VERSION=$(pre_release "$CURRENT_PY_VERSION")
          PRE_DEB_VERSION=$(pre_release "$DEB_VERSION")

          echo "Python version: $BASE_PY_VERSION, pre-release: ${PRE_PY_VERSION:-none}"
          echo "Debian version: $BASE_DEB_VERSION, pre-release: ${PRE_DEB_VERSION:-none}"

          if [ "$BASE_PY_VERSION" != "$BASE_DEB_VERSION" ] || [ "$PRE_PY_VERSION" != "$PRE_DEB_VERSION" ]; then
            echo "Version in $CHANGELOG: $DEB_VERSION"
            echo "Version in $VERSION_FILE: $CURRENT_PY_VERSION"
            echo "Error: major.minor.patch or pre-release (a, b, rc) in $CHANGELOG and $VERSION_FILE do not match."
            exit 1
          fi
          echo "Versions match. Debian revision, dev snapshot and post-release parts are ignored."
